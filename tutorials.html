<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inspired LED – Tutorials</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="mobile-nav.css">
  <style>
    :root {
      --gold: #ffd86b; --gold-light: #f2e688; --gold-dim: #c8960c;
      --bg-page: #111111; --bg-header: #3a3a3a; --bg-card: #1e1e1e;
      --border: #3a3a3a; --text-main: #f0f0ee; --text-muted: #999995;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Open Sans', sans-serif; font-size: 14px; background: var(--bg-page); color: var(--text-main); min-height: 100vh; }
    .header { background: var(--bg-header); padding: 0 40px; border-bottom: 1px solid #333; height: 80px; display: flex; align-items: center; }
    .logo-container { flex-shrink: 0; }
    .logo { height: 75px; display: block; }
    .nav-links { display: flex; gap: 20px; align-items: center; justify-content: center; flex: 1; }
    .nav-links a { font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 600; color: #aaaaaa; text-decoration: none; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 10px; border-radius: 4px; transition: color 0.2s, background 0.2s; white-space: nowrap; }
    .nav-links a:hover { color: var(--gold); background: rgba(255,216,107,0.07); }
    .nav-links a.active { color: var(--gold); }
    .page-wrapper { max-width: 1400px; margin: 0 auto; padding: 40px 32px 80px; }
    .section-eyebrow { font-family: 'Open Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 8px; }
    .page-title { font-family: 'Montserrat', sans-serif; font-size: 28px; font-weight: 700; color: var(--text-main); margin-bottom: 32px; }
    .forms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 760px; }
    .form-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 10px; transition: border-color 0.25s, transform 0.2s; }
    .form-card:hover { border-color: var(--gold); transform: translateY(-3px); }
    .form-card-icon { font-size: 28px; }
    .form-card-title { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 700; color: var(--text-main); }
    .form-card-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; flex: 1; }
    .form-card-btn { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #111; background: var(--gold); border: none; padding: 10px 18px; border-radius: 5px; text-decoration: none; text-align: center; transition: background 0.2s; }
    .form-card-btn:hover { background: var(--gold-light); }
    .tutorial-section { margin-bottom: 40px; }
    .tutorial-section-title { font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .state-message { text-align: center; padding: 60px 20px; color: var(--text-muted); font-family: 'Open Sans', sans-serif; font-size: 14px; }
    .state-message .icon { font-size: 2.5rem; margin-bottom: 12px; }
    @media (max-width: 600px) {
      .header { padding: 0 16px; gap: 16px; }
      .page-wrapper { padding: 24px 16px 48px; }
      .nav-links a { font-size: 10px; padding: 6px 8px; }
    }


  </style>
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <img src="InspiredLEDLogo_2026.png" alt="Inspired LED" class="logo" />
    </div>
    <nav class="nav-links" id="navLinks">
      <a href="leds.html">LEDs</a>
      <a href="led-sheets.html">LED Sheets &amp; Specialty</a>
      <a href="power.html">Power</a>
      <a href="connectors.html">Connectors</a>
      <a href="channel-lens.html">Channel &amp; Lens Cover</a>
      <a href="control.html">Control</a>
      <a href="tutorials.html" class="active">Tutorials</a>
      <a href="forms.html">Forms</a>
      <div class="nav-mobile-contact">
        <a href="tel:4809414286">(480) 941-4286</a>
        <a href="mailto:orders@inspiredled.com">orders@inspiredled.com</a>
      </div>
    </nav>
    <div class="contact-info">
        <div class="q">Questions?</div>
        <div class="d">(480) 941-4286 &nbsp;&middot;&nbsp; orders@inspiredled.com</div>
      </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="page-wrapper">
    <p class="section-eyebrow">Learn</p>
    <h1 class="page-title">Tutorials</h1>

    <div id="content">
      <div class="state-message"><div class="icon">⚡</div>Loading tutorials…</div>
    </div>
  </div>
<script>
  const API_URL   = 'https://script.google.com/macros/s/AKfycbzVs0pljy0IM55Tm65BXky729JlOhA_hvPa_clDrKKatnZ0uvaK7LZ-E2DwRm8_FfEa/exec';
  const SHEET_ID  = '1uwkWW5ItWHrLfhuP1BTbUOHouUQbyhtMemuexl3Y5H0';
  const SHEET     = 'Tutorials';
  const CACHE_KEY = `il-products-${SHEET}`;

  /* Column meaning for this sheet (same 5-column shape Apps Script
     already returns for every other tab, just interpreted differently):
       name    -> Tutorial Title
       img     -> Thumbnail Image URL (optional)
       spec    -> Tutorial Link (video or PDF)
       sku     -> Short Description (optional)
       section -> Category (groups tutorials under a heading) */

  function iconFor(link) {
    if (!link) return '🔗';
    const l = link.toLowerCase();
    if (l.endsWith('.pdf')) return '📄';
    if (l.includes('youtube.com') || l.includes('youtu.be') || l.includes('vimeo.com')) return '🎬';
    return '🔗';
  }

  function buildTutorialCard({ name, img, spec, sku }) {
    const card = document.createElement('div');
    card.className = 'form-card';
    card.innerHTML = `
      <div class="form-card-icon">${iconFor(spec)}</div>
      <div class="form-card-title">${name}</div>
      ${sku ? `<div class="form-card-desc">${sku}</div>` : ''}
      ${spec ? `<a href="${spec}" target="_blank" rel="noopener noreferrer" class="form-card-btn">View Tutorial</a>` : ''}
    `;
    return card;
  }

  function renderRows(valid) {
    const content = document.getElementById('content');
    if (!valid || valid.length === 0) {
      content.innerHTML = `<div class="state-message"><div class="icon">📭</div>No tutorials yet — add a row to the <strong>Tutorials</strong> tab in your Google Sheet to get started.</div>`;
      return;
    }
    const sections = {};
    const sectionOrder = [];
    valid.forEach(r => {
      const sec = r.section && r.section.trim() ? r.section.trim() : 'General';
      if (!sections[sec]) { sections[sec] = []; sectionOrder.push(sec); }
      sections[sec].push(r);
    });
    content.innerHTML = '';
    sectionOrder.forEach(secName => {
      const wrap = document.createElement('div');
      wrap.className = 'tutorial-section';
      const header = document.createElement('div');
      header.className = 'tutorial-section-title';
      header.textContent = secName;
      const grid = document.createElement('div');
      grid.className = 'forms-grid';
      grid.style.maxWidth = '900px';
      sections[secName].forEach(row => grid.appendChild(buildTutorialCard(row)));
      wrap.appendChild(header);
      wrap.appendChild(grid);
      content.appendChild(wrap);
    });
  }

  async function fetchGviz() {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET)}&tqx=out:json`;
    const res  = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
    return json.table.rows.map(row => ({
      name:    row.c[0]?.v || '',
      img:     row.c[1]?.v || '',
      spec:    row.c[2]?.v || '',
      sku:     row.c[3]?.v || '',
      section: row.c[4]?.v || ''
    })).filter(r => r.name && r.name.trim() && ['product name', 'tutorial title'].indexOf(r.name.trim().toLowerCase()) === -1);
  }

  async function fetchAppsScript() {
    const res  = await fetch(`${API_URL}?sheet=${encodeURIComponent(SHEET)}`);
    const rows = await res.json();
    return rows.filter(r => r.name && r.name.trim());
  }

  function sameData(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    return JSON.stringify(a) === JSON.stringify(b);
  }

  let currentData = null;

  async function loadFast() {
    try {
      const rows = await fetchGviz();
      if (!currentData || !sameData(currentData, rows)) {
        currentData = rows;
        renderRows(rows);
        sessionStorage.setItem(CACHE_KEY, JSON.stringify(rows));
      }
    } catch(e) {
      console.error('gviz fetch failed', e);
    }
  }

  async function loadAuthoritative(isBackground) {
    const content = document.getElementById('content');
    try {
      const rows = await fetchAppsScript();
      if (!sameData(currentData, rows)) {
        currentData = rows;
        renderRows(rows);
        sessionStorage.setItem(CACHE_KEY, JSON.stringify(rows));
      }
    } catch(e) {
      console.error(e);
      if (!isBackground && !content.querySelector('.form-card')) {
        content.innerHTML = `<div class="state-message"><div class="icon">⚠️</div>Couldn't load tutorials. Make sure the <strong>Tutorials</strong> tab exists in your sheet.</div>`;
      }
    }
  }

  /* 1. Instant paint from last session's cache, if any */
  const cached = sessionStorage.getItem(CACHE_KEY);
  if (cached) {
    try {
      currentData = JSON.parse(cached);
      renderRows(currentData);
    } catch(e) { /* ignore bad cache, fresh loads below will fix it */ }
  }

  /* 2. Fast paint from the quick public feed (~0.3s) */
  loadFast();

  /* 3. Authoritative check against the live sheet — silently corrects
     anything the fast feed hadn't caught up on yet */
  loadAuthoritative(false);

  /* 4. Keep reconciling with the authoritative source periodically */
  setInterval(() => loadAuthoritative(true), 30000);
</script>
<script src="mobile-nav.js"></script>
</body>
</html>
